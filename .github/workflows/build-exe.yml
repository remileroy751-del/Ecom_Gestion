name: Compiler l'exécutable Windows

# Se déclenche automatiquement :
#  - à chaque envoi (push) sur N'IMPORTE QUELLE branche, y compris le tout
#    premier envoi du dépôt ;
#  - à chaque création de tag de version (ex: v1.0) ;
#  - manuellement depuis l'onglet "Actions" (bouton "Run workflow").
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# Nécessaire pour que l'étape "Release" puisse publier l'exécutable.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Construire l'exécutable
        run: >
          pyinstaller --onefile --windowed --name GestionStock
          --collect-all customtkinter
          --hidden-import babel.numbers
          main.py

      - name: Construire l'outil de nettoyage des fichiers résiduels
        run: pyinstaller --onefile --windowed --name NettoyageGestionStock nettoyage_residus.py

      - name: Publier les exécutables (téléchargeables depuis l'onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: GestionStock-windows
          path: |
            dist/GestionStock.exe
            dist/NettoyageGestionStock.exe
          if-no-files-found: error

      # Si le déclencheur est un tag de version (ex: v1.0), crée aussi une
      # "Release" GitHub avec l'exécutable joint.
      - name: Créer une Release (uniquement sur un tag de version)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GestionStock.exe
            dist/NettoyageGestionStock.exe
